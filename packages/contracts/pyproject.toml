[project]
name = "agesoa-contracts"
version = "0.1.0"
description = "AGESOA contracts: CloudEvents JSON schemas + catalog, webhook and domain-pack schemas, with validators."
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema[format-nongpl]~=4.26",
  "referencing~=0.37",
]

[build-system]
requires = ["hatchling~=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agesoa_contracts"]
