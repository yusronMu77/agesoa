[project]
name = "agesoa-platform"
version = "0.1.0"
description = "AGESOA shared technical library: settings + demo_mode, DB sessions, outbox/inbox, Pub/Sub push with OIDC, auth, HMAC/hash, logging and tracing. No domain logic."
requires-python = ">=3.13,<3.14"
dependencies = [
  "agesoa-contracts",
  "fastapi~=0.141",
  "uvicorn[standard]~=0.54",
  "pydantic~=2.14",
  "pydantic-settings~=2.15",
  "sqlalchemy[asyncio]~=2.1",
  "asyncpg~=0.32",
  "psycopg[binary]~=3.3",
  "alembic~=1.20",
  "google-cloud-pubsub~=2.42",
  "google-auth~=2.61",
  "requests~=2.32",
  "httpx~=0.28",
  "opentelemetry-sdk~=1.42",
  "opentelemetry-exporter-gcp-trace~=1.15",
  "opentelemetry-instrumentation-asgi~=0.63b1",
]

[project.scripts]
agesoa-dev-relay = "agesoa_platform.devtools.relay:main"

[build-system]
requires = ["hatchling~=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agesoa_platform"]
