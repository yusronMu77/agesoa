[project]
name = "agesoa-packs"
version = "0.1.0"
description = "AGESOA core engine for domain packs: format validation, loader and generic rule evaluation. Domain-agnostic."
requires-python = ">=3.13,<3.14"
dependencies = ["agesoa-contracts"]

[build-system]
requires = ["hatchling~=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agesoa_packs"]
